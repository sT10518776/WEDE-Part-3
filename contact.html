<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Aroma Heaven Polokwane</title>
<meta name="description" content="Contact Aroma Heaven Coffee Shop in Polokwane.">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body>
<header class="header"><nav class="navbar"><div class="logo">Aroma Heaven</div>
<ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a href="about.html">About</a></li><li><a href="enquiry.html">Enquiry</a></li><li><a href="contact.html" class="active">Contact</a></li></ul><button class="hamburger">☰</button></nav></header>
<main class="container"><h1>Contact Us</h1>
<form id="contactForm" class="contact-form" action="https://formspree.io/f/mayvlokb" method="POST" novalidate>
<input type="text" id="cName" name="name" placeholder="Your Name" required><span class="error"></span>
<input type="email" id="cEmail" name="email" placeholder="Email" required><span class="error"></span>
<select id="cType" name="type" required><option value="">Message Type</option><option>General</option><option>Complaint</option><option>Compliment</option></select><span class="error"></span>
<textarea id="cMessage" name="message" placeholder="Your Message" required minlength="15"></textarea><span class="error"></span>
<button type="submit" class="btn">Send Email</button></form>
<div id="formStatus" class="card" style="display:none;margin-top:1rem;"></div>
<div id="map" style="height:300px;margin-top:2rem;border-radius:.5em;"></div></main>
<footer class="footer"><p>&copy; 2026 Aroma Heaven</p></footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/main.js"></script><script src="js/forms.js"></script>
</body></html>
